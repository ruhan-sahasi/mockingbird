name: ci

on:
  push:
    branches: [main]
  # No branch filter: the PRs are stacked, so most of them target another PR's branch.
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # --locked fails the build if uv.lock is out of date, instead of quietly updating it.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The lockfile is not at the repo root, so say where it is.
          cache-dependency-path: web/package-lock.json
      # npm ci installs exactly what package-lock.json says and fails if it disagrees with package.json.
      - run: npm ci
      - run: npm test
      # tsconfig.json is a single real config, so this checks src/ and vite.config.ts.
      - run: npx tsc --noEmit
      - run: npm run lint
      # The production build is the only check that the AudioWorklet modules bundle.
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          # The version that wrote .terraform.lock.hcl.
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # No backend and no AWS credentials: this checks the configuration, not the live stack.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
