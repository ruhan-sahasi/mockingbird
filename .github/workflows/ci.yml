name: ci

on:
  push:
    branches: [main]
  # No branch filter: the PRs are stacked, so most of them target another PR's branch.
  pull_request:

permissions:
  contents: read

# Every job has a time limit. A test that hangs on a socket read would otherwise hold the runner
# for GitHub's default of six hours.
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgresStore is the only store the deployed server uses, and the migrations run on every
    # container start, so their tests run here against a real Postgres 16. Without
    # TEST_DATABASE_URL they would be skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A direct connection: the tests' scratch schemas use a session-level SET (test_store.py).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # --locked fails the build if uv.lock is out of date, instead of quietly updating it.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The lockfile is not at the repo root, so say where it is.
          cache-dependency-path: web/package-lock.json
      # npm ci installs exactly what package-lock.json says and fails if it disagrees with package.json.
      - run: npm ci
      - run: npm test
      # tsconfig.json is a single real config, so this checks src/ and vite.config.ts.
      - run: npx tsc --noEmit
      - run: npm run lint
      # The production build is the only check that the AudioWorklet modules bundle.
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          # The version that wrote .terraform.lock.hcl.
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # No backend and no AWS credentials: this checks the configuration, not the live stack.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # The server image, built and booted the way Fargate runs it: ARM64 (infra/ecs.tf), under
  # QEMU on this x86 runner. Nothing is pushed. This is the only place the Dockerfile, the
  # entrypoint and the uvicorn flags run before a deploy does.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # shellcheck comes with the runner image. Warnings and errors fail; style notes do not.
      - run: shellcheck --severity=warning scripts/*.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: mockingbird:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Dummy settings and no DATABASE_URL: the entrypoint skips the migration, and the server
      # starts on its in-memory store. None of these values reaches Vapi or Anthropic.
      - name: Boot the image and check /healthz
        run: |
          docker run --detach --name app --platform linux/arm64 --publish 8000:8000 \
            --env ANTHROPIC_API_KEY=ci --env VAPI_API_KEY=ci \
            --env PUBLIC_BASE_URL=http://localhost:8000 \
            --env BRAIN_SECRET=ci --env WEBHOOK_SECRET=ci \
            --env OWNER_KEY=ci --env VISITOR_SALT=ci \
            mockingbird:ci
          for _ in $(seq 60); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          test "$(curl -fsS http://localhost:8000/healthz)" = '{"ok":true}'
      - name: The package imports as the unprivileged user
        run: |
          docker exec app sh -c 'test "$(id -u)" = 10001'
          docker exec app uv run python -c 'import mockingbird.app'
      - name: Show the container's log
        if: always()
        run: docker logs app || true
